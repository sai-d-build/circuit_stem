name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.8'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Run coordinate conversion lint check
      run: dart scripts/check_coordinate_conversions.dart

    - name: Run tests with coverage
      run: flutter test --coverage --test-randomize-ordering-seed random

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info

    - name: Check performance budgets
      run: |
        # Extract performance metrics from test output
        flutter test test/performance/game_canvas_performance_test.dart --machine > performance_results.json

        # Check drag operation performance budget (p50 ≤ 8ms, p99 ≤ 16ms)
        if ! jq -e '.groups[]?.tests[]? | select(.name | contains("drag operation performance")) | .metrics.p50 <= 8 and .metrics.p99 <= 16' performance_results.json; then
          echo "❌ Drag operation performance budget exceeded"
          exit 1
        fi

        # Check placement performance budget (≤ 50ms)
        if ! jq -e '.groups[]?.tests[]? | select(.name | contains("component placement performance")) | .metrics.totalTime <= 50' performance_results.json; then
          echo "❌ Component placement performance budget exceeded"
          exit 1
        fi

        echo "✅ All performance budgets met"

    - name: Check coordinate conversion accuracy
      run: |
        # Run coordinate legacy tests to ensure no regressions
        flutter test test/coordinate_legacy_test.dart --machine > coordinate_results.json

        # Check that all coordinate conversion tests pass
        if ! jq -e 'all(.groups[]?.tests[]?; .outcome == "success")' coordinate_results.json; then
          echo "❌ Coordinate conversion accuracy regression detected"
          exit 1
        fi

        echo "✅ Coordinate conversion accuracy maintained"

  analyze:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.8'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze

    - name: Check formatting
      run: flutter format --set-exit-if-changed .

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.8'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Build web
      run: flutter build web --release