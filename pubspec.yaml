name: circuit_stem
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0' # Dart 3 compatible

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # UI & assets
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  vector_graphics: ^1.1.9+2

  # Game engine
  flame: ^1.18.0
  flame_audio: ^2.11.8

  # State management (runtime only)
  provider: ^6.1.5+1
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  rxdart: ^0.28.0

  # Data & utils
  collection: ^1.19.1
  uuid: ^4.4.0
  shared_preferences: ^2.5.3
  widgets_to_image: ^2.0.1
  meta: ^1.16.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5 # Added equatable

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation (stable 2.x toolchain)
  build_runner: ^2.5.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  source_gen: ^2.0.0

  # (No riverpod_generator/custom_lint to avoid pulling Freezed 3.x)
  # riverpod_generator: removed
  # custom_lint: removed

  # Testing
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  mockito: ^5.4.4 # Added mockito

  # Linting
  flutter_lints: ^6.0.0

# NOTE: no dependency_overrides section here — let pub solve analyzer/macro versions itself

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/levels/
