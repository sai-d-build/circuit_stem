name: sparkcircuit
description: "Dive into the exciting world of electronics with Circuit STEM, a sleek educational app that lets you build, test, and master circuits through an engaging, interactive frontend."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  shared_preferences: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
